<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>desafio 3. tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;


        }
        table{

        width: 500px;
        height: 300px;
        border-collapse: collapse;
            
           
        }
        thead{
            background-color: gray;
            color: white;
               
        }

        th,td{
            padding: 10px;
            border: 1px solid black;
            text-align: center;
        }

       
        .exatas{

            color: white;
        }
        

        .exatas > th{
            text-align: left;
        }


        .humanas{

            color: white;
        }



        .humanas > th{
            text-align: left;
        }
    </style>
</head>
