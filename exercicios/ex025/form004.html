<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario tel e email</title>
</head>
<body>
    <h1>Exemplo de formulário tel e email</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
<fieldset>   
    <legend>Dados Pessoais</legend>
            <p>
                <label for="inome">nome</label>
                <input type="text" name="nome" id="iname" minlength="5" maxlength="20" >
            </p>
    
            <p>
                <label for="imail"> E-mail :</label>
                <input type="email" name="email" id="imail" autocomplete="email" required>
    
            </p
            >
          
    
                <p>
                    <label for="itel">telefone :</label>
                    <input type="tel" name="tel" id=" itel" autocomplete="  mobile" required pattern="^ /(/dd{2}/)/d{4,5}-/d{4} $">
                </p>
            <!--Estudar mais sobre REgEx-->
</fieldset>


            <p>
                <input type="submit" value="enviar">
                <input type="reset" value="limpar">
            </p>
        
    </form>


    <form action="cadastro.php" method="get" autocomplete="on" >

        <fieldset>
            <legend>informaçôes do seu pet</legend>
            <p>
                <label for="iname">Qual o nome do Pet?</label>
                <input type="text" name="name" id="iname">
            </p>
            <p>
                <label for="itipo">Qual pet</label>
                <input type="text" name="tipo" id="itipo">
            </p>
            <p>
                <label for="ipeso">peso do animal</label>
                <input type="number" name="peso" id="ipeso" step="0.1" >

        </fieldset>

        <p>
            <input type="submit" value="enviar">
            <input type="reset" value="lmpar">
